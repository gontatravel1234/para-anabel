<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Flores para ti, Anabel</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
:root{--gold:#ffc933;--soft:#f3dfa2}
*{margin:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;color:var(--soft);background:radial-gradient(ellipse at 50% 40%,#0d1132,#05060f 70%);font-family:'Playfair Display',Georgia,serif;touch-action:manipulation;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
.t{position:fixed;left:0;right:0;text-align:center;padding:0 7vw;opacity:0;transition:opacity 1s;pointer-events:none}
.t.on{opacity:1}
#txt{top:calc(11vh + env(safe-area-inset-top,0px));font-style:italic;font-size:clamp(1.1rem,4.6vw,1.7rem);line-height:1.4;text-shadow:0 0 14px rgba(255,201,51,.35)}
#cnt{top:42%;transform:translateY(-50%);display:flex;justify-content:center;gap:clamp(14px,5vw,40px)}
#cnt b{display:block;font-size:clamp(1.7rem,8vw,3rem);color:var(--gold);text-shadow:0 0 16px rgba(255,201,51,.6);font-variant-numeric:tabular-nums}
#cnt small{font-size:.75rem;font-style:italic;opacity:.7;letter-spacing:.1em}
#go{bottom:calc(14vh + env(safe-area-inset-bottom,0px));font-size:.8rem;font-style:italic;letter-spacing:.2em}
#fin{top:46%;transform:translateY(-50%)}
#fin h1{font-size:clamp(2rem,10vw,3.8rem);line-height:1.15;color:#fff4c4;text-shadow:0 0 12px var(--gold),0 0 40px rgba(255,201,51,.7)}
#fin p{margin-top:1.4rem;font-style:italic;opacity:.9;font-size:clamp(1.1rem,5vw,1.5rem);line-height:1.5}
#start{top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;gap:.8rem;padding-top:28vh}
#fin em{display:block;margin-top:2.2rem;font-size:.9rem;opacity:.6}
#start h2{font-size:clamp(2rem,10vw,3.4rem);color:#fff4c4;text-shadow:0 0 24px rgba(255,201,51,.6)}
#start span{font-style:italic;opacity:.8;font-size:1.15rem;letter-spacing:.05em;transition:opacity 1s}
#start span.off{opacity:0}
</style>
</head>
<body>
<audio id="song" src="aleluya.mp3" loop preload="auto"></audio>
<canvas id="c"></canvas>
<div class="t" id="txt"></div>
<div class="t" id="cnt">
  <div><b id="d">0</b><small>días</small></div>
  <div><b id="h">0</b><small>horas</small></div>
  <div><b id="m">0</b><small>minutos</small></div>
  <div><b id="s">0</b><small>segundos</small></div>
</div>
<div class="t" id="go">toca para continuar</div>
<div class="t" id="fin"><h1>Eres muy especial<br>para mí</h1><p>quiero verte siempre<br>sonreír</p><em id="sig"></em></div>
<div class="t on" id="start"><h2 id="who"></h2><span>toca para comenzar</span></div>

<script>
/* ====== PERSONALIZA AQUÍ ====== */
const CFG = {
  name: 'Anabel',
  start: new Date('2001-10-10T00:00:00')   // 10 de octubre de 2001
};
/* ============================== */

const $ = s => document.querySelector(s), cv = $('#c'), g = cv.getContext('2d');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const cl = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
$('#who').textContent = 'Para ' + CFG.name;
$('#sig').textContent = '— para ' + CFG.name + ' ♥';
document.title = 'Flores para ti, ' + CFG.name;

let W, H, u, bx, by, mode = 'wander', rise = false, holdable = false, holding = false, last = 0;
const S = { grow: 0, bloom: 0, heart: 0, fade: 1, hold: 0 };
const tw = (k, to, ms) => new Promise(r => {
  const a = S[k], t0 = performance.now();
  (function f(n) { const p = cl((n - t0) / ms); S[k] = a + (to - a) * ease(p); p < 1 ? requestAnimationFrame(f) : r(); })(t0);
});

/* ---------- luciérnagas ---------- */
const N = 650;
const F = Array.from({ length: N }, () => ({ x: -99, y: -99, vx: 0, vy: 0, tx: 0, ty: 0, nx: 0, ny: 0, ph: Math.random() * 6.283, r: .6 + Math.random() * 1.5 }));
let inited = false;

function buildName() {
  const cw = 1100, ch = 260, o = document.createElement('canvas'); o.width = cw; o.height = ch;
  const c = o.getContext('2d');
  c.fillStyle = '#fff'; c.font = 'italic 700 170px "Playfair Display",Georgia,serif';
  c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(CFG.name, cw / 2, ch / 2);
  const d = c.getImageData(0, 0, cw, ch).data, p = [];
  let x0 = 1e9, x1 = 0, y0 = 1e9, y1 = 0;
  for (let y = 0; y < ch; y += 3) for (let x = 0; x < cw; x += 3) if (d[(y * cw + x) * 4 + 3] > 128) {
    p.push([x, y]); x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y);
  }
  if (!p.length) return;
  p.sort(() => Math.random() - .5);
  const s = Math.min(W * .84 / (x1 - x0), 1.8), mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
  F.forEach((f, i) => { const q = p[Math.floor(i * p.length / N)]; f.nx = W / 2 + (q[0] - mx) * s; f.ny = H * .42 + (q[1] - my) * s; });
}
function cluster() {
  F.forEach(f => { const a = Math.random() * 6.283, r = Math.sqrt(Math.random()) * u * 2.6; f.tx = W / 2 + Math.cos(a) * r * 1.5; f.ty = H * .37 + Math.sin(a) * r * .7; });
}
function setMode(m) {
  mode = m;
  if (m === 'name') F.forEach(f => { f.tx = f.nx; f.ty = f.ny; });
  if (m === 'cluster') cluster();
  if (m === 'wander') F.forEach(f => { f.vx = (Math.random() - .5) * 3; f.vy = (Math.random() - .5) * 3; });
}
function stepF(t) {
  for (const f of F) {
    if (mode === 'wander') {
      f.vx += Math.cos(t / 2300 + f.ph * 3) * .012; f.vy += Math.sin(t / 1900 + f.ph * 5) * .012 - (rise ? .004 : 0);
      f.vx *= .985; f.vy *= .985; f.x += f.vx; f.y += f.vy;
      if (f.x < -20) f.x = W + 20; if (f.x > W + 20) f.x = -20;
      if (f.y < -20) f.y = H + 20; if (f.y > H + 20) f.y = -20;
    } else {
      f.x += (f.tx - f.x) * .045 + Math.sin(t / 400 + f.ph) * .25;
      f.y += (f.ty - f.y) * .045 + Math.cos(t / 450 + f.ph) * .25;
    }
  }
}
function drawF(t) {
  g.globalCompositeOperation = 'lighter';
  for (const f of F) {
    const a = .3 + .7 * Math.abs(Math.sin(t / 900 + f.ph));
    g.fillStyle = `rgba(255,200,60,${a * .16})`; g.beginPath(); g.arc(f.x, f.y, f.r * 4, 0, 6.283); g.fill();
    g.fillStyle = `rgba(255,228,140,${a})`; g.beginPath(); g.arc(f.x, f.y, f.r, 0, 6.283); g.fill();
  }
  g.globalCompositeOperation = 'source-over';
}

/* ---------- flores ---------- */
let FL = [];
const CENTER = 6;
function layout() {
  u = Math.min(W / 8, H / 11); bx = W / 2; by = H * .84;
  const k = u * .19, hc = by - 5.4 * u, hp = [];
  for (let i = 0; i < 13; i++) {
    const t = i / 13 * 6.283 + .2;
    hp.push([bx + 16 * Math.pow(Math.sin(t), 3) * k, hc - (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * k]);
  }
  hp.sort((a, b) => a[0] - b[0]);
  FL = hp.map((h, i) => {
    const a = (i / 12 - .5) * 1.6, L = u * (5.5 - Math.abs(a) * 1.3 - (i % 2) * .55);
    return { hx: bx + Math.sin(a) * L, hy: by - Math.cos(a) * L, gx: h[0], gy: h[1], ph: i * 1.7 };
  });
}
const pos = (f, t = 0) => { const e = ease(S.heart); return [f.hx + (f.gx - f.hx) * e + Math.sin(t / 1500 + f.ph) * u * .03, f.hy + (f.gy - f.hy) * e]; };

const TUL = [['#ff6b8b','#c4204f'], ['#ff9fb5','#d9446f'], ['#ff5470','#a8153f'], ['#ffb3c6','#e0527a']];
function head(x, y, r, b, rot, glow) {
  const c = TUL[Math.round(rot / 1.7) % TUL.length], w = r * .62 * b, h = r * 1.55 * b;
  g.save(); g.translate(x, y + r * .25); g.rotate(Math.sin(rot) * .12);
  g.shadowColor = `rgba(255,120,150,${.45 + glow})`; g.shadowBlur = r * (.5 + glow * 2);
  // pétalo trasero
  g.fillStyle = c[1]; g.beginPath(); g.moveTo(-w * .5, -h * .2);
  g.bezierCurveTo(-w * .6, -h * .8, -w * .15, -h * 1.1, 0, -h * 1.2);
  g.bezierCurveTo(w * .15, -h * 1.1, w * .6, -h * .8, w * .5, -h * .2); g.fill();
  g.shadowBlur = 0;
  // pétalos laterales
  for (const s of [-1, 1]) {
    const gr = g.createLinearGradient(0, 0, 0, -h); gr.addColorStop(0, c[1]); gr.addColorStop(1, c[0]);
    g.fillStyle = gr; g.beginPath(); g.moveTo(0, 0);
    g.bezierCurveTo(s * w * 1.25, -h * .1, s * w * 1.1, -h * .8, s * w * .55, -h * 1.12);
    g.bezierCurveTo(s * w * .3, -h * .8, s * w * .2, -h * .3, 0, 0); g.fill();
  }
  // pétalo frontal
  const gf = g.createLinearGradient(0, 0, 0, -h); gf.addColorStop(0, c[1]); gf.addColorStop(.6, c[0]); gf.addColorStop(1, '#fff0f3');
  g.fillStyle = gf; g.beginPath(); g.moveTo(0, 0);
  g.bezierCurveTo(-w * .85, -h * .05, -w * .7, -h * .7, -w * .12, -h * 1.0);
  g.bezierCurveTo(w * .05, -h * 1.08, w * .12, -h * 1.0, w * .12, -h * 1.0);
  g.bezierCurveTo(w * .7, -h * .7, w * .85, -h * .05, 0, 0); g.fill();
  g.restore();
}
function drawFlowers(t) {
  if (S.grow <= 0 || S.fade <= 0) return;
  g.save(); g.globalAlpha = S.fade;
  // maceta
  const pw = u * .8 * cl(S.grow * 4);
  g.fillStyle = '#6b3a14'; g.beginPath(); g.moveTo(bx - pw, by); g.lineTo(bx + pw, by); g.lineTo(bx + pw * .7, by + u * .6); g.lineTo(bx - pw * .7, by + u * .6); g.fill();
  FL.forEach((f, i) => {
    const [x, y] = pos(f, t), p = cl(S.grow * 1.5 - Math.abs(i - CENTER) / 6 * .5);
    if (p <= 0) return;
    const cx = bx + (x - bx) * .15, cy = by - (by - y) * .55;
    g.strokeStyle = '#2f8f3c'; g.lineWidth = u * .07; g.lineCap = 'round'; g.beginPath(); g.moveTo(bx, by);
    let px = bx, py = by;
    for (let k = 1; k <= 24; k++) { const s = k / 24 * ease(p), m = 1 - s; px = m * m * bx + 2 * m * s * cx + s * s * x; py = m * m * by + 2 * m * s * cy + s * s * y; g.lineTo(px, py); }
    g.stroke();
    if (p < 1) { g.fillStyle = '#ffe28c'; g.shadowColor = '#ffc933'; g.shadowBlur = 10; g.beginPath(); g.arc(px, py, 2.2, 0, 6.283); g.fill(); g.shadowBlur = 0; }
  });
  if (S.bloom > 0) FL.forEach((f, i) => {
    const [x, y] = pos(f, t), b = ease(cl(S.bloom * 1.4 - i * .02));
    let r = u * .72, glow = 0;
    if (i === CENTER) { r *= 1.15 * (1 + S.hold * .18); glow = S.hold + (holdable ? .15 * Math.sin(t / 400) : 0); }
    head(x, y, r, b, f.ph, glow);
  });
  if (holdable && S.hold > 0) {
    const [x, y] = pos(FL[CENTER], t);
    g.strokeStyle = 'rgba(255,230,150,.9)'; g.lineWidth = 3; g.beginPath(); g.arc(x, y, u * 1.2, -1.571, -1.571 + 6.283 * S.hold); g.stroke();
  }
  g.restore();
}

/* ---------- bucle ---------- */
function loop(t) {
  requestAnimationFrame(loop);
  const dt = t - (last || t); last = t;
  if (holdable) S.hold = cl(S.hold + (holding ? dt / 1400 : -dt / 700));
  if (holdable && S.hold >= 1) reveal();
  g.clearRect(0, 0, W, H); stepF(t); drawF(t); drawFlowers(t);
}
function size() {
  const D = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = W * D; cv.height = H * D; g.setTransform(D, 0, 0, D, 0, 0);
  if (!inited) { F.forEach(f => { f.x = Math.random() * W; f.y = Math.random() * H; }); inited = true; }
  layout(); buildName();
}
addEventListener('resize', size);

/* ---------- interacción ---------- */
let tapR = null;
const tap = () => new Promise(r => tapR = r);
addEventListener('pointerdown', e => {
  startMusic();
  if (tapR) { const r = tapR; tapR = null; r(); }
  if (holdable) { const [x, y] = pos(FL[CENTER]); if (Math.hypot(e.clientX - x, e.clientY - y) < u * 2.2) holding = true; }
});
['pointerup', 'pointercancel'].forEach(ev => addEventListener(ev, () => holding = false));

let musicOn = false;
function startMusic() {
  if (musicOn) return;
  const a = $('#song'); a.volume = 0;
  const p = a.play();
  if (p) p.then(() => {
    musicOn = true; let v = 0;
    const f = setInterval(() => { v = Math.min(.85, v + .05); a.volume = v; if (v >= .85) clearInterval(f); }, 150);
  }).catch(() => {});
}
const show = (s, on = true) => $(s).classList.toggle('on', on);
async function say(m, ms) { $('#txt').textContent = m; show('#txt'); await sleep(ms); show('#txt', false); await sleep(900); }
function tick() {
  const d = Date.now() - CFG.start, p = n => String(n);
  $('#d').textContent = p(Math.floor(d / 864e5)); $('#h').textContent = p(Math.floor(d / 36e5) % 24);
  $('#m').textContent = p(Math.floor(d / 6e4) % 60); $('#s').textContent = p(Math.floor(d / 1e3) % 60);
}

let revealed = false;
async function reveal() {
  if (revealed) return; revealed = true; holdable = false; holding = false; S.hold = 0;
  show('#txt', false);
  await tw('heart', 1, 2600); await sleep(1400);
  await tw('fade', 0, 2000);
  rise = true; setMode('wander'); show('#fin');
}

async function main() {
  size(); requestAnimationFrame(loop);
  try { await document.fonts.load('italic 700 100px "Playfair Display"'); buildName(); } catch (e) {}
  await tap(); startMusic(); setTimeout(() => $('#start span').classList.add('off'), 5000); await sleep(1000);
  await say('Cierra los ojos un momento', 4000);
  await say('mira las luciérnagas...', 3200);
  setMode('name'); setTimeout(() => show('#start', false), 2500); await say('se alinean por ti', 4400);
  setMode('cluster');
  $('#txt').textContent = 'Empezaste a iluminar al mundo con tu presencia hace...'; show('#txt'); tick(); const iv = setInterval(tick, 1000);
  await sleep(1200); show('#cnt'); await sleep(2500); show('#go');
  await tap();
  show('#go', false); show('#cnt', false); show('#txt', false); clearInterval(iv);
  setMode('wander'); await sleep(1200);
  await Promise.all([tw('grow', 1, 4200), say('cada una crece con todo mi cariño y admiración.', 4500)]);
  await Promise.all([tw('bloom', 1, 2800), say('porque mereces lo mejor de mí.', 3600)]);
  $('#txt').textContent = 'Mantén presionada la flor central para revelar...'; show('#txt');
  holdable = true;
}
main();
</script>
</body>
</html>
